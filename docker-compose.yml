# The control plane, one service. AI generation happens on edge-ai (Ollama) --
# reached over the LAN via OLLAMA_BASE_URL -- so nothing heavy runs here. Data is
# a SQLite file on the mounted ./data volume. Per-machine config is .env
# (gitignored; see .env.example).
#
#   make run     -> docker compose up -d --build
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: storefront-ai
    ports:
      - "${PORT:-8820}:8820"
    extra_hosts:
      # Lets OLLAMA_BASE_URL=http://host.docker.internal:11434 reach an Ollama
      # running on THIS host (local dev). For the edge-ai box just use its LAN IP.
      - "host.docker.internal:host-gateway"
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b-instruct}
      DATABASE_URL: ${DATABASE_URL:-sqlite:///data/storefront.db}
      REDDIT_CLIENT_ID: ${REDDIT_CLIENT_ID:-}
      REDDIT_CLIENT_SECRET: ${REDDIT_CLIENT_SECRET:-}
      REDDIT_USER_AGENT: ${REDDIT_USER_AGENT:-storefront-ai/0.1 (niche research)}
      JINA_READER_BASE: ${JINA_READER_BASE:-https://r.jina.ai}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
