# Render + ship the storefront whenever approved content (or the themes /
# builder) changes on main. Pure rendering -- no LLM, no LAN: generation
# already happened at home and its output is committed in content/.
#
# One-time setup after `terraform apply` (see infra/):
#   gh variable set AWS_DEPLOY_ROLE_ARN --body "$(terraform -chdir=infra output -raw deploy_role_arn)"
#   gh variable set SITE_BUCKET         --body "$(terraform -chdir=infra output -raw bucket)"
#   gh variable set CF_DIST_ID          --body "$(terraform -chdir=infra output -raw distribution_id)"
name: deploy

on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "site/**"
      - "app/agents/shop/themes/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  id-token: write   # OIDC -> AWS role, no stored keys
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the static site from approved content
        run: |
          pip install markdown
          python3 site/build.py --file content/export.json

      - name: Assume the deploy role (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Sync to S3 + invalidate CloudFront
        run: |
          aws s3 sync site/dist "s3://${{ vars.SITE_BUCKET }}" --delete
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CF_DIST_ID }}" --paths "/*" >/dev/null
          echo "deployed"
